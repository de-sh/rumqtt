[workspace]
members = [
  "rumqttc",
  "rumqttd",
  "benchmarks",
  "benchmarks/simplerouter",
]
resolver = "2"

[workspace.package]
edition = "2021"
repository = "https://github.com/bytebeamio/rumqtt"
license = "Apache-2.0"
authors = ["tekjar <raviteja@bytebeam.io>"]

[profile.dev]
# producing debug info in builds takes up a lot of space on runner, and we
# are currently not using it.
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true

# Usage: cargo build --profile profiling -p benchmarks --bin <name>
[profile.profiling]
inherits = "release" # keeping actual optimizations
debug = 1
strip = false # retain debug symbols for readable flamegraphs
